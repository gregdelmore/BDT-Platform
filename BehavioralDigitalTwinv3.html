    <style>
        /* Global & Layout Styles */
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .sidebar-item { transition: all 0.2s ease; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 8px; font-weight: 600; color: #4b5563; }
        /* Deep Indigo Blue for BDT branding */
        .bg-bdt-primary { background-color: #374151; }
        .text-bdt-primary { color: #1e3a8a; } 
        .border-bdt-primary { border-color: #1e3a8a; } 
        .sidebar-item.active { background-color: #1e3a8a; color: white; box-shadow: 0 4px 10px rgba(30, 58, 138, 0.4); }
        .sidebar-item:hover:not(.active) { background-color: #e5e7eb; color: #1f2937; }
        .card { box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06); border-radius: 0.75rem; background-color: white; }
        
        /* BDT Specific Colors & Microcopy Styles */
        .status-connected { background-color: #10b981; color: white; }
        .status-pending { background-color: #fcd34d; color: #78350f; }
        .status-error { background-color: #f87171; color: #991b1b; }
        .confidence-verified { background-color: #06b6d4; color: white; } /* Cyan for verified/agentic */
        .confidence-high { background-color: #34d399; color: #065f46; } 
        .confidence-low { background-color: #fca5a5; color: #881111; } 
        .confidence-medium { background-color: #fcd34d; color: #92400e; } 
        .twin-status-ready { background-color: #10b981; color: white; }
        .twin-status-learning { background-color: #fbbf24; color: #78350f; }
        .chat-message-assistant { background-color: #e0f7fa; border-radius: 1rem 1rem 1rem 0.5rem; }
        .chat-message-user { background-color: #1e3a8a; border-radius: 1rem 1rem 0.5rem 1rem; } 
        .chart-placeholder {
            min-height: 250px; background-color: #f8fafc; border: 1px solid #e5e7eb;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #6b7280;
            border-radius: 0.5rem; text-align: center; font-weight: 600;
        }
        .ontology-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .ontology-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1); }
        .h-in-loop-button { transition: background-color 0.15s ease; }
        .risk-badge { font-size: 0.7rem; padding: 4px 8px; border-radius: 9999px; font-weight: 700; }
        /* Added for Process Confidence visualization */
        .confidence-bar-container { width: 100%; background: #e5e7eb; border-radius: 4px; overflow: hidden; height: 8px; margin-top: 4px; }
        .confidence-bar { height: 100%; background-color: #10b981; transition: width 0.3s ease; }

        function getIcon(name, size = 6) {
            return icons[name] ? `<span class="h-${size} w-${size} inline-block">${icons[name]}</span>` : '';
        }

        function getStatusBadge(status) {
            const colors = {
                'Connected': 'status-connected',
                'Pending Auth': 'status-pending',
                'Error': 'status-error'
            };
            return `<span class="text-xs font-semibold px-3 py-1 rounded-full ${colors[status]}">${status.toUpperCase()}</span>`;
        }

        function showLoadingIndicator(show, message = "Switching context...") {
            const loadingArea = document.getElementById('loading-overlay');
            if (loadingArea) {
                loadingArea.innerHTML = show ? 
                    `<div class="absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center z-40 rounded-xl">
                        <div class="flex items-center space-x-3 p-4 bg-indigo-50 border-t-4 border-bdt-primary rounded-lg shadow-xl">
                            <svg class="animate-spin h-5 w-5 text-bdt-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                            <p class="text-sm font-medium text-gray-700">${message}</p>
                        </div>
                    </div>` : '';
            }
        }

        function showAlert(message, type = 'success') {
            let container = document.getElementById('alert-container'); 
            if (!container) {
                 container = document.createElement('div');
                 container.id = 'alert-container';
                 document.body.appendChild(container);
            }

            console.log(`[ALERT/${type.toUpperCase()}]: ${message}`); 

            const color = type === 'success' ? 'bg-green-50 border-green-400 text-green-700' : 
                          type === 'error' ? 'bg-red-50 border-red-400 text-red-700' :
                          'bg-indigo-50 border-indigo-400 text-indigo-700';
            const icon = type === 'success' ? icons.CheckCircle : icons.AlertTriangle;
            
            const alert = document.createElement('div');
            alert.className = `fixed top-4 right-4 z-50 p-4 rounded-lg border-l-4 ${color} shadow-xl transition-opacity duration-300`;
            alert.innerHTML = `<div class="flex items-center space-x-3">${getIcon('Zap', 5)}<p class="font-medium text-sm">${message}</p><button onclick="this.parentNode.parentNode.remove()" class="ml-auto text-gray-500 hover:text-gray-900">X</button></div>`;
            
            container.appendChild(alert);
            
            setTimeout(() => {
                alert.style.opacity = '0';
                setTimeout(() => alert.remove(), 300);
            }, 5000);
        }
        
        function switchPersona(newPersonaId) {
            if (newPersonaId === appState.activePersonaId) return;

            // Show loading indicator before starting the switch
            showLoadingIndicator(true);

            setTimeout(() => {
                // 1. Update State
                appState.activePersonaId = newPersonaId;
                appState.ontologyValues = CLONE_DATA_MAP[newPersonaId].ontology_mapping;
                appState.currentChatIndex = -1; // Reset chat context

                // 2. Re-render UI
                renderApp();
                
                // 3. Post-switch cleanup
                showAlert(`Switched to persona: ${newPersonaId}`, 'info');
                showLoadingIndicator(false);

                // Re-render chart if on the persona page
                if (appState.currentPage === 'Persona') {
                    setTimeout(updateOntologyChart, 100);
                }
            }, 300); // Small delay to simulate network latency and show the loading state
        }

                    (appState.hasConsented ? renderDashboardLayout() : renderConsentPage())
                    : renderLoginPage()}
            `;
        }

        // --- CHART JS IMPLEMENTATION ---

        let ontologyChartInstance = null;
        function updateOntologyChart() {
            const ctx = document.getElementById('ontologyChart');
            if (!ctx) return;

            if (ontologyChartInstance) {
                ontologyChartInstance.destroy();
            }

            const data = {
                labels: Object.keys(appState.ontologyValues),
                datasets: [{
                    label: 'Learned Behavioral Profile',
                    data: Object.values(appState.ontologyValues).map(o => o.value),
                    fill: true,
                    backgroundColor: 'rgba(30, 58, 138, 0.2)', // BDT Primary semi-transparent
                    borderColor: '#1e3a8a',
                    pointBackgroundColor: '#1e3a8a',
                    pointBorderColor: '#fff',
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: '#1e3a8a'
                }]
            };

            ontologyChartInstance = new Chart(ctx, {
                type: 'radar',
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    elements: {
                        line: { borderWidth: 3 }
                    },
                    scales: {
                        r: {
                            angleLines: { display: false },
                            suggestedMin: 0,
                            suggestedMax: 100,
                            pointLabels: {
                                font: { size: 14, weight: 'bold' },
                                color: '#374151'
                            },
                            ticks: { display: false }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: 'Fourth Ontology Mapping (Behavioral DNA)', font: { size: 16 } }
                    }
                }
            });
        }

        function updateOntologyValue(key, newValue) {
            const numericValue = parseInt(newValue);

            updateOntologyChart();
            showAlert(`Tuning: ${key} parameter set to ${numericValue}. Agent boundary adjusted for ${appState.activePersonaId}.`, 'info');

        function renderIntegrationsPage() { // 6.3 Settings - Admin
            
            // --- Comprehensive Integrations List ---

                { name: "Outlook Mail", system: "Microsoft 365", status: "Connected", mode: "Continuous" },

                    <div class="card p-5 border-l-4 ${i.status === 'Connected' ? 'border-green-600' : i.status === 'Error' ? 'border-red-600' : 'border-yellow-600'} flex flex-col justify-between hover:shadow-lg transition">

                            <h4 class="text-lg font-bold text-gray-800 flex items-center gap-2">${getIcon('Briefcase', 5)} ${i.name}</h4>

                        <div>

                            <button

            return `
                <div class="space-y-8">

                        ${integrationCards}
                    </div>
                    <div class="card p-6 border-l-4 border-gray-400">
                        <h4 class="text-xl font-bold text-gray-800 mb-2">Audit & Compliance Controls</h4>
                        <p class="text-sm text-gray-600">Ensures all data access and agent actions are fully auditable as required by the Security and Compliance section.</p>
                        <button onclick="showAlert('Mock: Opening full data use audit log.', 'info')" class="mt-2 text-sm font-semibold text-indigo-600 hover:underline">View Complete Data Use Audit Log</button>

                </div>
            `;
        }


        // --- Event Handlers & Chat Logic ---
        
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('login-error');

            if (username === appState.USER_EMAIL && password === appState.USER_PASS) {
                appState.isLoggedIn = true;
                appState.currentPage = 'Consent'; 
                renderApp();
                showAlert('Login successful! Please confirm BDT Consent Policy.', 'success');
            } else {
                errorElement.innerText = 'Invalid username or password.';
                errorElement.style.display = 'block';
                showAlert('Login failed. Check credentials.', 'error');
            }
        }

        function handleConsent() {
            const consentChecked = document.getElementById('consent-checkbox').checked;
            if (consentChecked) {
                appState.hasConsented = true;
                appState.currentPage = 'Dashboard';
                renderApp();
                showAlert('Consent confirmed. Initiating data ingestion.', 'success');
                // Auto-start chat with the first query after consent
                setTimeout(() => simulateQuery(false), 500); 
                // Render chart after DOM is ready
                if (appState.currentPage === 'Persona') {
                     setTimeout(updateOntologyChart, 100);
                }
            } else {
                showAlert('You must confirm consent to proceed with the BDT platform.', 'error');
            }
        }

        function handleLogout() {
            appState.isLoggedIn = false;
            appState.hasConsented = false;
            appState.currentPage = 'Dashboard';
            appState.currentChatIndex = -1;
            // Destroy chart instance
            if (ontologyChartInstance) {
                ontologyChartInstance.destroy();
                ontologyChartInstance = null;
            }
            renderApp();
            showAlert('Logged out successfully.', 'info');
        }

        function changePage(pageName) {
            showLoadingIndicator(true, `Loading ${pageName} view...`);
            setTimeout(() => {
                appState.currentPage = pageName;
                renderApp();
                showLoadingIndicator(false);
                if (pageName === 'Persona') {
                    // Ensure chart renders when navigating to the Persona page
                    setTimeout(updateOntologyChart, 100);
                }
            }, 300);
        }
        
        function handleIntegrationAction(name, status) {
            if (status === 'Connected') {
                showAlert(`Mock: Paused sync for ${name}. Ingestion Mode set to 'One-Time'.`, 'error');
            } else {
                showAlert(`Mock: Initiated OAuth flow for ${name}. Connection successful! Mode: Continuous Ingestion.`, 'success');
            }
            setTimeout(renderApp, 500);
        }

        function handleHILTAction(actionType, task) {
            const chatHistory = document.getElementById('chatHistory');
            
            // FIX: Use lastElementChild to ensure we get the DOM element node, not a text node, 
            // and then query the controls within that element.
            const lastMessageElement = chatHistory ? chatHistory.lastElementChild : null;

            if (actionType === 'Approve') {
                showAlert(`L4 Agent Action Approved: ${task}. Email sent via MS Graph API (mock).`, 'success');
                
                if (lastMessageElement) {
                    // Find the HILT controls within the last message bubble
                    const hiltControls = lastMessageElement.querySelector('.h-in-loop-controls');
                    if (hiltControls) {
                        hiltControls.innerHTML = `<span class="font-bold text-green-700 flex items-center gap-1">${getIcon('CheckCircle', 5)} Action Approved and Executed.</span>`;
                    }
                }
            } else if (actionType === 'Edit') {
                showAlert(`L4 Agent Action Sent to Editor: Draft for ${task} opened for manual changes.`, 'info');
            } else if (actionType === 'Cancel') {
                showAlert(`L4 Agent Action Blocked/Cancelled: ${task} terminated. Guardrail violation logged.`, 'error');
                
                if (lastMessageElement) {
                    const hiltControls = lastMessageElement.querySelector('.h-in-loop-controls');
                    if (hiltControls) {
                        hiltControls.innerHTML = `<span class="font-bold text-red-700 flex items-center gap-1">${getIcon('AlertTriangle', 5)} Action Cancelled by User (HILT Override).</span>`;
                    }
                }
            }
        }

        function createMessageElement(isUser, contentHTML) {
            return `
                <div class="flex ${isUser ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-3xl p-4 rounded-xl shadow-lg ${isUser ? 'chat-message-user text-white' : 'chat-message-assistant text-gray-800'}" style="width: fit-content;">
                        ${contentHTML}
                    </div>
                </div>
            `;
        }

        function simulateQuery(userInitiated) {
            const chatHistory = document.getElementById('chatHistory');
            const userInput = document.getElementById('userInput');
            
            if (userInitiated) {
                // For a real prototype, you would process userInput. For the demo, we advance the query index.
                userInput.value = '';
            }

            // Use the active persona data for simulation
            const personaId = appState.activePersonaId; 
            const personaData = CLONE_DATA_MAP[personaId];

            if (!personaData.sample_queries) {
                 chatHistory.innerHTML += createMessageElement(false, `<p>No sample queries are defined for the selected persona (${appState.activePersonaId}). Switch back to Davinci to see the demo.</p>`);
                 chatHistory.scrollTop = chatHistory.scrollHeight;
                 return;
            }

            appState.currentChatIndex = (appState.currentChatIndex + 1) % personaData.sample_queries.length;
            const queryData = personaData.sample_queries[appState.currentChatIndex];

            // 1. User Message
            chatHistory.innerHTML += createMessageElement(true, `<p>${queryData.question}</p>`);
            
            // 2. BDT Response
            let hiltControls = '';
            if (queryData.is_agent_action) {
                // Implement HILT (Human-in-the-Loop) controls for Level 4 actions
                hiltControls = `
                    <div class="h-in-loop-controls border-t pt-3 mt-3 flex space-x-3">
                        <button onclick="handleHILTAction('Approve', 'Vendor Follow-up Draft')" class="bg-green-500 text-white px-4 py-2 rounded-lg font-semibold h-in-loop-button hover:bg-green-600 flex items-center gap-1">${getIcon('CheckCircle', 4)} Approve & Send</button>
                        <button onclick="handleHILTAction('Edit', 'Vendor Follow-up Draft')" class="bg-indigo-500 text-white px-4 py-2 rounded-lg font-semibold h-in-loop-button hover:bg-indigo-600 flex items-center gap-1">${getIcon('Settings', 4)} Edit Draft</button>
                        <button onclick="handleHILTAction('Cancel', 'Vendor Follow-up Draft')" class="bg-red-500 text-white px-4 py-2 rounded-lg font-semibold h-in-loop-button hover:bg-red-600 flex items-center gap-1">${getIcon('Shield', 4)} Cancel/Override</button>
                    </div>
                    <p class="text-red-600 text-xs mt-2 font-bold flex items-center gap-1">${getIcon('AlertTriangle', 4)} HILT Required: Action requires human confirmation due to Level 4 capability.</p>
                `;
            }

            const cloneResponseHTML = `
                <div class="font-bold text-lg mb-2 flex items-center">
                    ${getIcon('Server', 5)}
                    <span class="ml-2 text-bdt-primary">BDT Engine Response</span>
                    <span class="ml-auto text-sm font-semibold px-2 py-1 rounded-full ${queryData.confidence.color}">
                        ${queryData.confidence.level} (${queryData.confidence.score}%)
                    </span>
                </div>
                <p class="mb-3">${queryData.answer}</p>
                
                <div class="space-y-2 mb-4">
                    ${queryData.details.map(item => `<li class="border-l-4 border-gray-300 pl-3 text-sm">${item.text}</li>`).join('')}
                </div>
                
                <div class="border-t pt-2 mt-2 text-xs text-gray-500">
                    <p class="font-semibold mb-1">Reasoning Summary: <span class="text-gray-700">${queryData.reasoning}</span></p>
                    
                    <button onclick="toggleEvidence(this)" class="text-indigo-600 hover:underline flex items-center gap-1 mt-2">
                        ${getIcon('Zap', 4)} Why this answer? (Expand Detailed Evidence)
                    </button>
                    
                    <div class="evidence-detail p-3 mt-2 rounded-lg bg-gray-100 border-l-4 border-cyan-500" style="display:none;">
                        <p class="font-bold text-cyan-700 mb-1">Retrieval-Augmented Generation (RAG) Provenance:</p>
                        ${queryData.details.map(item => `
                            <div class="mt-2">
                                <p class="font-semibold text-gray-700 flex justify-between items-center">${item.source}:
                                    <button onclick="showAlert('Mock: Opening document in source application.', 'info')" class="text-xs text-green-700 hover:underline flex items-center">Open Source</button>
                                </p>
                                <p class="text-gray-600">${item.text.replace(/\*\*/g, '').substring(0, 100)}...</p>
                            </div>
                        `).join('')}
                    </div>

                    <div class="flex items-center space-x-3 mt-3">
                        <span class="font-semibold">Feedback:</span>
                        <button onclick="showAlert('Feedback: Helpful', 'success')" class="text-green-600 hover:text-green-800">Helpful</button>
                        <button onclick="showAlert('Feedback: Wrong', 'error')" class="text-red-600 hover:text-red-800">Wrong</button>
                    </div>
                </div>
                ${hiltControls}
            `;
            chatHistory.innerHTML += createMessageElement(false, cloneResponseHTML);

            // Scroll to the bottom
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
        
        function toggleEvidence(element) {
            const detail = element.parentNode.querySelector('.evidence-detail');
            if (detail) {
                detail.style.display = detail.style.display === 'block' ? 'none' : 'block';
            }
        }


        // --- Initial Load ---
        window.onload = () => {
            // Sample data that was previously defined separately is integrated here for initialization compatibility.
            CLONE_DATA_MAP["Davinci (The Renaissance Man)"].sample_queries = [ 
                {
                    question: "Delegate drafting and sending the concise follow-up email to Microsoft regarding the delayed hardware shipment.",
                    answer: "Task delegated to Level 4 Agent: **Vendor Follow-up Draft** (Awaiting HILT Approval). The BDT has generated the draft below, using the modeled *Concise/Direct* communication style and prioritizing the urgency based on the *Temporal Intelligence* rhythm profile.",
                    details: [
                        { text: "**Draft Output (Action):** 'Microsoft Team: Ship date for PO 4455 is now T+3 days past schedule. Please provide specific, revised ETA and explanation by EOD today. This will impact Client Y’s deployment schedule. Employee Twin.'", source: "A.4 Culture Template" },
                        { text: "**Risk-Adaptive Verification:** Passed. Contains no financial authorization and aligns with **Low Technical Risk** profile.", source: "Trust & Verification Layer" },
                        { text: "**Action:** Draft saved to Outlook Drafts. **Requires Human-in-the-Loop approval before sending.**", source: "System Log" }
                    ],
                    confidence: { score: 95, level: "Verified", color: "confidence-verified" },
                    reasoning: "The model used the Persona's 'Concise' attribute and the 'Last-minute' deadline pattern to prioritize urgency.",
                    is_agent_action: true // Flag for HILT controls
                },
                {
                    question: "Why did Employee Twin reject the recent proposal for the open-source firewall deployment?",
                    answer: "The BDT predicts rejection based on the Behavioral Twin's risk profile and negative space analysis, aligning with the **Fear Ontology** dimension.",
                    details: [
                        { text: "**Decision:** REJECTED. Reasoning: The proposal uses an open-source solution that lacks enterprise support and a clear vendor liability path.", source: "A.3 Decision Logic Mining Template" },
                        { text: "**Evidence (Negative Space):** Logs show zero instances of the adoption or promotion of open-source network infrastructure over the last 3 years.", source: "5.2 Negative Space Analysis" },
                    ],
                    confidence: { score: 92, level: "High", color: "confidence-high" },
                    reasoning: "A strong pattern of risk aversion was detected in document decisions.",
                    is_agent_action: false
                }
            ];
            
            // Adding placeholder logic to prevent errors if switching away from Davinci (who holds the sample queries)
            CLONE_DATA_MAP["Infra Triage Team"].sample_queries = [
                {
                    question: "How does the Infra Triage Team typically handle a Tier-1 alert?",
                    answer: "The Infra Triage Team follows the **P1 Server Outage Resolution SOP** (Process Adherence: 95%). Their behavioral twin prioritizes rapid escalation (Escalation Speed: 70%) to minimize downtime.",
                    details: [{ text: "Process documented in sharepoint/runbooks/SOP_P1_ServerOutage.pdf", source: "Process Map" }],
                    confidence: { score: 90, level: "Verified", color: "confidence-verified" },
                    reasoning: "High Process Adherence and rapid escalation preference is modeled from group communication logs.",
                    is_agent_action: false
                }
            ];
            
            renderApp();
        };

    </script>
