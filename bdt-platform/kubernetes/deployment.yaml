# BDT Platform - Kubernetes Deployment Manifests
# Complete production-ready deployment for all services

---
apiVersion: v1
kind: Namespace
metadata:
  name: bdt-platform
  labels:
    name: bdt-platform
    environment: production

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: bdt-config
  namespace: bdt-platform
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  # Database URLs (using internal service names)
  DATABASE_URL: "postgresql+asyncpg://bdt:$(POSTGRES_PASSWORD)@postgres-service:5432/bdt_poc"
  REDIS_URL: "redis://redis-service:6379"
  # Service URLs
  ORCHESTRATION_SERVICE_URL: "http://orchestration-service:8000"
  SECURITY_SERVICE_URL: "http://security-service:8005"
  INGESTION_SERVICE_URL: "http://ingestion-service:8001"
  PROCESSING_SERVICE_URL: "http://processing-service:8002"
  ANALYSIS_SERVICE_URL: "http://analysis-service:8003"
  UI_BACKEND_URL: "http://ui-backend-service:8004"
  MONITORING_SERVICE_URL: "http://monitoring-service:9090"
  # Vector Database
  QDRANT_URL: "http://qdrant-service:6333"
  # Message Queue
  RABBITMQ_URL: "amqp://bdt:$(RABBITMQ_PASSWORD)@rabbitmq-service:5672"
  # Monitoring
  JAEGER_HOST: "jaeger-service"
  JAEGER_PORT: "6831"
  PROMETHEUS_URL: "http://prometheus-service:9090"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: bdt-secrets
  namespace: bdt-platform
type: Opaque
stringData:
  # Database
  POSTGRES_PASSWORD: "change-in-production"
  RABBITMQ_PASSWORD: "change-in-production"
  # Security
  JWT_SECRET_KEY: "change-to-secure-secret"
  ENCRYPTION_KEY: "change-to-secure-key"
  # OAuth
  MS_CLIENT_ID: "your-microsoft-client-id"
  MS_CLIENT_SECRET: "your-microsoft-client-secret"
  MS_TENANT_ID: "your-microsoft-tenant-id"
  # AI Services
  OPENAI_API_KEY: "your-openai-api-key"
  ANTHROPIC_API_KEY: "your-anthropic-api-key"

---
# PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bdt-platform
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "bdt"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bdt-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: "bdt_poc"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - bdt
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - bdt
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: init-scripts
        configMap:
          name: postgres-init
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: bdt-platform
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: bdt-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command: ["redis-server", "--appendonly", "yes"]
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: redis-storage
        emptyDir: {}

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: bdt-platform
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379

---
# Qdrant Vector Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: bdt-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        ports:
        - containerPort: 6333
        - containerPort: 6334
        env:
        - name: QDRANT__SERVICE__GRPC_PORT
          value: "6334"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        volumeMounts:
        - name: qdrant-storage
          mountPath: /qdrant/storage
      volumes:
      - name: qdrant-storage
        emptyDir: {}

---
# Qdrant Service
apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
  namespace: bdt-platform
spec:
  selector:
    app: qdrant
  ports:
  - name: http
    port: 6333
    targetPort: 6333
  - name: grpc
    port: 6334
    targetPort: 6334

---
# RabbitMQ StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: bdt-platform
spec:
  serviceName: rabbitmq-service
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        ports:
        - containerPort: 5672
        - containerPort: 15672
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: "bdt"
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: bdt-secrets
              key: RABBITMQ_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: rabbitmq-storage
          mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
  - metadata:
      name: rabbitmq-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi

---
# RabbitMQ Service
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: bdt-platform
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672

---
# Orchestration Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestration-service
  namespace: bdt-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orchestration-service
  template:
    metadata:
      labels:
        app: orchestration-service
        version: "5.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: orchestration
        image: bdt/orchestration-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: bdt-config
        - secretRef:
            name: bdt-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

---
# Orchestration Service
apiVersion: v1
kind: Service
metadata:
  name: orchestration-service
  namespace: bdt-platform
spec:
  selector:
    app: orchestration-service
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP

