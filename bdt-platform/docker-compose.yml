version: '3.8'

services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    container_name: bdt-postgres
    environment:
      POSTGRES_USER: bdt
      POSTGRES_PASSWORD: bdt123
      POSTGRES_DB: bdt_poc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bdt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdt"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bdt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bdt-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bdt-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - bdt-network
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bdt-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: bdt
      RABBITMQ_DEFAULT_PASS: bdt123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bdt-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Phase 5 - Orchestration Service
  orchestration-service:
    build:
      context: ./phase5-integration/orchestration
      dockerfile: Dockerfile
    container_name: bdt-orchestration
    environment:
      DATABASE_URL: postgresql+asyncpg://bdt:bdt123@postgres/bdt_poc
      REDIS_URL: redis://redis:6379
      INGESTION_SERVICE_URL: http://ingestion-service:8001
      PROCESSING_SERVICE_URL: http://processing-service:8002
      ANALYSIS_SERVICE_URL: http://analysis-service:8003
      UI_BACKEND_URL: http://ui-backend:8004
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MS_CLIENT_ID: ${MS_CLIENT_ID}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET}
      MS_TENANT_ID: ${MS_TENANT_ID}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bdt-network
    volumes:
      - ./phase5-integration/orchestration:/app
    restart: unless-stopped

  # Phase 5 - Security Service
  security-service:
    build:
      context: ./phase5-integration/security
      dockerfile: Dockerfile
    container_name: bdt-security
    environment:
      DATABASE_URL: postgresql+asyncpg://bdt:bdt123@postgres/bdt_security
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-key-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-generate-new-key-for-production}
      MS_CLIENT_ID: ${MS_CLIENT_ID}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET}
      MS_TENANT_ID: ${MS_TENANT_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bdt-network
    restart: unless-stopped

  # Phase 5 - Monitoring Service
  monitoring-service:
    build:
      context: ./phase5-integration/monitoring
      dockerfile: Dockerfile
    container_name: bdt-monitoring
    environment:
      DATABASE_URL: postgresql+asyncpg://bdt:bdt123@postgres/bdt_monitoring
      REDIS_URL: redis://redis:6379
      JAEGER_HOST: jaeger
      JAEGER_PORT: 6831
      PUSHGATEWAY_URL: http://prometheus-pushgateway:9091
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bdt-network
    restart: unless-stopped

  # Phase 1 - Ingestion Service
  ingestion-service:
    build:
      context: ./phase1-ingestion
      dockerfile: Dockerfile
    container_name: bdt-ingestion
    environment:
      DATABASE_URL: postgresql+asyncpg://bdt:bdt123@postgres/bdt_poc
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://bdt:bdt123@rabbitmq:5672
      MS_CLIENT_ID: ${MS_CLIENT_ID}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET}
      MS_TENANT_ID: ${MS_TENANT_ID}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bdt-network
    restart: unless-stopped

  # Phase 2 - Processing Service
  processing-service:
    build:
      context: ./phase2-processing
      dockerfile: Dockerfile
    container_name: bdt-processing
    environment:
      DATABASE_URL: postgresql+asyncpg://bdt:bdt123@postgres/bdt_poc
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RABBITMQ_URL: amqp://bdt:bdt123@rabbitmq:5672
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - bdt-network
    restart: unless-stopped

  # Phase 3 - Analysis Service
  analysis-service:
    build:
      context: ./phase3-analysis
      dockerfile: Dockerfile
    container_name: bdt-analysis
    environment:
      DATABASE_URL: postgresql+asyncpg://bdt:bdt123@postgres/bdt_poc
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - bdt-network
    restart: unless-stopped

  # Phase 4 - UI Backend
  ui-backend:
    build:
      context: ./phase4-ui/backend
      dockerfile: Dockerfile
    container_name: bdt-ui-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://bdt:bdt123@postgres/bdt_poc
      REDIS_URL: redis://redis:6379
      ORCHESTRATION_URL: http://orchestration-service:8000
      SECURITY_URL: http://security-service:8005
    ports:
      - "8004:8004"
    depends_on:
      orchestration-service:
        condition: service_started
      security-service:
        condition: service_started
    networks:
      - bdt-network
    restart: unless-stopped

  # Phase 4 - UI Frontend
  ui-frontend:
    build:
      context: ./phase4-ui/frontend
      dockerfile: Dockerfile
    container_name: bdt-ui-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      ui-backend:
        condition: service_started
    networks:
      - bdt-network
    restart: unless-stopped

  # API Gateway (Kong)
  kong-database:
    image: postgres:15-alpine
    container_name: bdt-kong-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong123
      POSTGRES_DB: kong
    volumes:
      - kong_data:/var/lib/postgresql/data
    networks:
      - bdt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong-migrations:
    image: kong:3.4-alpine
    container_name: bdt-kong-migrations
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong123
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - bdt-network
    restart: on-failure

  kong:
    image: kong:3.4-alpine
    container_name: bdt-kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong123
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
    ports:
      - "8080:8000"  # Proxy port
      - "8443:8443"  # Proxy SSL port
      - "8081:8001"  # Admin API
      - "8444:8444"  # Admin API SSL
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    networks:
      - bdt-network
    volumes:
      - ./phase5-integration/api-gateway/kong.yml:/kong/declarative/kong.yml
    restart: unless-stopped

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: bdt-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./phase5-integration/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - bdt-network
    restart: unless-stopped

  prometheus-pushgateway:
    image: prom/pushgateway:latest
    container_name: bdt-pushgateway
    ports:
      - "9092:9091"
    networks:
      - bdt-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: bdt-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./phase5-integration/monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - bdt-network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: bdt-jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
      - "9411:9411"
    environment:
      COLLECTOR_OTLP_ENABLED: true
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    networks:
      - bdt-network
    restart: unless-stopped

  # Load Balancer (Nginx)
  nginx:
    image: nginx:alpine
    container_name: bdt-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./phase5-integration/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./phase5-integration/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - kong
      - ui-frontend
    networks:
      - bdt-network
    restart: unless-stopped

  # Celery Worker for Background Tasks
  celery-worker:
    build:
      context: ./phase5-integration/orchestration
      dockerfile: Dockerfile.celery
    container_name: bdt-celery-worker
    command: celery -A tasks worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://bdt:bdt123@postgres/bdt_poc
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://bdt:bdt123@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bdt-network
    restart: unless-stopped

  # Celery Beat for Scheduled Tasks
  celery-beat:
    build:
      context: ./phase5-integration/orchestration
      dockerfile: Dockerfile.celery
    container_name: bdt-celery-beat
    command: celery -A tasks beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://bdt:bdt123@postgres/bdt_poc
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://bdt:bdt123@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bdt-network
    restart: unless-stopped

  # Flower - Celery Monitoring
  flower:
    image: mher/flower:latest
    container_name: bdt-flower
    command: celery --broker=amqp://bdt:bdt123@rabbitmq:5672 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - bdt-network
    restart: unless-stopped

networks:
  bdt-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  rabbitmq_data:
  kong_data:
  prometheus_data:
  grafana_data:
